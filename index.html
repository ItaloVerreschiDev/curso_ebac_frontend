<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container">
    <div class="row">
        <div class="col-md-8">
            <h2>Entre em contato</h2>
            <form>
                    <label class="form-label-sm" for="nome">Seu nome:</label>
                    <input class="form-control" type="text" id="nome">
                    <label class="form-label-sm" for="email">Seu e-mail:</label>
                    <input class="form-control" type="email" id="email">
                    <label class="form-label-sm" for="telefone">Seu telefone:</label>
                    <input class="form-control" type="number" id="telefone">
                <button class="btn btn-outline-primary">Enviar formulário</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
